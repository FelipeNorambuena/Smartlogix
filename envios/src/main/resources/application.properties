spring.application.name=${SPRING_APPLICATION_NAME:envios}
spring.profiles.default=dev

server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartlogix_shipping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.time_zone=${JPA_TIME_ZONE:UTC}
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}

shipping.security.api-key=${ENVIOS_API_KEY:}
shipping.security.header-name=${ENVIOS_API_KEY_HEADER:X-API-Key}
shipping.orders-service-url=${ORDERS_SERVICE_URL:http://localhost:8084}
shipping.orders-api-key=${PEDIDOS_API_KEY:}
shipping.orders-api-key-header=${PEDIDOS_API_KEY_HEADER:X-API-Key}
shipping.orders-service-user-id=${ENVIOS_SERVICE_USER_ID:00000000-0000-0000-0000-000000000000}
shipping.orders-service-roles=${ENVIOS_SERVICE_ROLES:ADMIN}

springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
