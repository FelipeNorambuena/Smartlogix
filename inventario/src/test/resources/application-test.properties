server.port=0

spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:inventario-test;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${TEST_JPA_DDL_AUTO:create-drop}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false
