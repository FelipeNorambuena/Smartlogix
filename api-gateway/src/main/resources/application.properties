server.port=${SERVER_PORT:8080}
spring.application.name=${SPRING_APPLICATION_NAME:api-gateway}

# Shared JWT configuration. Must match auth-service.
security.jwt.secret=${JWT_SECRET:smartlogix-auth-dev-secret-change-me-1234567890}
security.jwt.issuer=${JWT_ISSUER:smartlogix-auth}

# Local service URLs for Laragon/dev environment.
gateway.routes.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8082}

# Public and protected auth-service routes.
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=${gateway.routes.auth-service-url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=auth-service-users
spring.cloud.gateway.server.webmvc.routes[1].uri=${gateway.routes.auth-service-url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**

# React local origins allowed during development.
gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
