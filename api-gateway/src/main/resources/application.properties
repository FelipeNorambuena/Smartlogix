server.port=${SERVER_PORT:8080}
spring.application.name=${SPRING_APPLICATION_NAME:api-gateway}

# Shared JWT configuration. Must match auth-service.
security.jwt.secret=${JWT_SECRET:smartlogix-auth-dev-secret-change-me-1234567890}
security.jwt.issuer=${JWT_ISSUER:smartlogix-auth}

# Local service URLs for Laragon/dev environment.
gateway.routes.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8082}
gateway.routes.inventory-service-url=${INVENTORY_SERVICE_URL:http://localhost:8081}
gateway.routes.inventory-api-key=${INVENTARIO_API_KEY:local-dev-inventory-key}

# Public and protected auth-service routes.
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=${gateway.routes.auth-service-url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=auth-service-users
spring.cloud.gateway.server.webmvc.routes[1].uri=${gateway.routes.auth-service-url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/users/**

# Inventory routes exposed with gateway-friendly paths.
# /inventory/products/** is translated to inventory-service /api/products/**
spring.cloud.gateway.server.webmvc.routes[2].id=inventory-products
spring.cloud.gateway.server.webmvc.routes[2].uri=${gateway.routes.inventory-service-url}
spring.cloud.gateway.server.webmvc.routes[2].order=-10
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/inventory/products,/inventory/products/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[2].filters[1]=PrefixPath=/api/products
spring.cloud.gateway.server.webmvc.routes[2].filters[2]=SetRequestHeader=X-API-Key, ${gateway.routes.inventory-api-key}

# /inventory/** is translated to inventory-service /api/inventory/**
spring.cloud.gateway.server.webmvc.routes[3].id=inventory-stock
spring.cloud.gateway.server.webmvc.routes[3].uri=${gateway.routes.inventory-service-url}
spring.cloud.gateway.server.webmvc.routes[3].order=-5
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/inventory,/inventory/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[3].filters[1]=PrefixPath=/api/inventory
spring.cloud.gateway.server.webmvc.routes[3].filters[2]=SetRequestHeader=X-API-Key, ${gateway.routes.inventory-api-key}

# React local origins allowed during development.
gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
