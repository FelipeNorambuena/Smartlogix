server.port=${SERVER_PORT:8082}
spring.application.name=${SPRING_APPLICATION_NAME:auth-service}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartlogix_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.jdbc.time_zone=${JPA_TIME_ZONE:UTC}
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}

security.jwt.secret=${JWT_SECRET:smartlogix-auth-dev-secret-change-me-1234567890}
security.jwt.issuer=${JWT_ISSUER:smartlogix-auth}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

auth.bootstrap-admin.enabled=${AUTH_BOOTSTRAP_ADMIN_ENABLED:false}
auth.bootstrap-admin.email=${AUTH_BOOTSTRAP_ADMIN_EMAIL:admin@smartlogix.com}
auth.bootstrap-admin.password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:Admin12345}

springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
